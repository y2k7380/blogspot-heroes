<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0e1520"/>
<stop offset="1" stop-color="#152418"/>
</linearGradient>
<linearGradient id="barG" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3d8bfd"/>
<stop offset="1" stop-color="#5fd38a"/>
</linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<rect x="48" y="56" width="560" height="300" rx="16" fill="#141c28" stroke="#2a3a4a" stroke-width="2"/>
<text xml:space="preserve" x="72" y="98" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#e6eef0" font-weight="bold">APK footprint (bundled → Play services)</text>
<text xml:space="preserve" x="72" y="140" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#8aa3a8" font-weight="normal">bundled LiteRT + GPU binaries</text>
<rect x="72" y="156" width="480" height="36" rx="6" fill="#3a2a2a" stroke="#ec8f8f" stroke-width="1.5"/>
<text xml:space="preserve" x="88" y="180" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#ffb0b0" font-weight="normal">runtime inside every APK</text>
<text xml:space="preserve" x="72" y="230" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#8aa3a8" font-weight="normal">play-services-litert:17.0.0</text>
<rect x="72" y="246" width="300" height="36" rx="6" fill="#1a2e24" stroke="#5fd38a" stroke-width="1.5"/>
<text xml:space="preserve" x="88" y="270" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#9eecc0" font-weight="normal">shared runtime via Play services</text>
<text xml:space="preserve" x="72" y="320" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#5fd38a" font-weight="bold">~8 MB smaller APK  ·  &gt;100K apps still bundle</text>
<rect x="640" y="56" width="592" height="300" rx="16" fill="#141c28" stroke="#2a3a4a" stroke-width="2"/>
<text xml:space="preserve" x="664" y="98" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#e6eef0" font-weight="bold">GPU inference (ML Drift)</text>
<text xml:space="preserve" x="664" y="148" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#8aa3a8" font-weight="normal">legacy TFLite GPU delegate</text>
<rect x="664" y="164" width="280" height="28" rx="4" fill="#ffb558"/>
<text xml:space="preserve" x="664" y="220" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#8aa3a8" font-weight="normal">CompiledModel + Accelerator.GPU</text>
<rect x="664" y="236" width="392" height="28" rx="4" fill="url(#barG)"/>
<text xml:space="preserve" x="664" y="300" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#5fd38a" font-weight="bold">~1.4× faster than legacy GPU delegate</text>
<rect x="48" y="380" width="1184" height="272" rx="16" fill="#121820" stroke="#2a3a4a" stroke-width="2"/>
<circle cx="76" cy="412" r="7" fill="#ec5f5f"/>
<circle cx="102" cy="412" r="7" fill="#f0b94e"/>
<circle cx="128" cy="412" r="7" fill="#5fc46f"/>
<text xml:space="preserve" x="170" y="417" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#8aa3a8" font-weight="normal">CompiledModel path · play-services-litert</text>
<text xml:space="preserve" x="72" y="456" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#c3cbe0" font-weight="normal">1  implementation 'com.google.android.gms:play-services-litert:17.0.0'</text>
<text xml:space="preserve" x="72" y="490" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#7fc8e8" font-weight="normal">2  LiteRt.initialize(ctx, opts { setEnableGpu(true) }).await()</text>
<text xml:space="preserve" x="72" y="524" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#5fd38a" font-weight="normal">3  CompiledModel.Options(Accelerator.GPU, Accelerator.CPU)</text>
<text xml:space="preserve" x="72" y="558" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#e6eef0" font-weight="normal">4  create once off main thread · reuse · close when done</text>
<text xml:space="preserve" x="72" y="592" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#ffb558" font-weight="normal">⚠  setEnableGpu default false · minSdk 24 · don't mix tflite-java</text>
<text xml:space="preserve" x="48" y="690" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#7d9599" font-weight="normal">LiteRT in Google Play services · announced 2026-10-28 · Android 7+ / Wear OS 4+ / Automotive</text>
</svg>