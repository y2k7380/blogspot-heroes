  <path d="M1110 290 C 1090 200, 1040 170, 990 170" fill="none" stroke="#d9a35c" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M996 162 l-10 8 l10 8" fill="none" stroke="#d9a35c" stroke-width="3"/>
  <!-- labels -->
  <g font-family="'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size="20" fill="#cfd8e6" text-anchor="middle">
    <text x="311" y="44">compact</text>
    <text x="519" y="44">medium</text>
    <text x="808" y="44">expanded</text>
  </g>
  <g stroke="#cfd8e6" stroke-width="1.5" opacity="0.6">
    <path d="M311 52 v40"/><path d="M519 52 v40"/><path d="M808 52 v40"/>
  </g>
</svg>
