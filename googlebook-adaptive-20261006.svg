      <rect x="700" y="200" width="96" height="40" rx="6" fill="#9fb7dc"/>
      <rect x="700" y="248" width="96" height="40" rx="6"/>
      <rect x="700" y="296" width="96" height="40" rx="6"/>
      <rect x="700" y="344" width="96" height="40" rx="6"/>
    </g>
    <rect x="804" y="150" width="4" height="324" rx="2" fill="#b7c0ce"/>
    <rect x="816" y="152" width="136" height="80" rx="6" fill="#dfe6f1"/>
    <g fill="#c4ccd8">
      <rect x="816" y="244" width="136" height="8" rx="4"/>
      <rect x="816" y="262" width="118" height="8" rx="4"/>
      <rect x="816" y="280" width="128" height="8" rx="4"/>
      <rect x="816" y="298" width="96" height="8" rx="4"/>
      <rect x="816" y="326" width="136" height="8" rx="4"/>
      <rect x="816" y="344" width="110" height="8" rx="4"/>
    </g>
    <!-- resize arrows at corner -->
    <path d="M948 474 l14 0 l0 -14" fill="none" stroke="#5d7bb0" stroke-width="3"/>
  </g>
  <!-- width scale under windows -->
  <g stroke="#7fb69a" stroke-width="3" fill="none">
    <path d="M236 500 h150"/><path d="M404 500 h230"/><path d="M652 500 h312"/>
  </g>
  <!-- cursor -->
  <path d="M884 404 l0 34 l9 -9 l7 15 l6 -3 l-7 -14 l13 0 z" fill="#ffffff" stroke="#1b2433" stroke-width="2"/>
  <!-- laptop base / keyboard -->
  <path d="M120 572 L1080 572 L1130 622 Q1132 632 1120 634 L80 634 Q68 632 70 622 Z" fill="url(#deck)"/>
  <g fill="#556173">
    <rect x="200" y="580" width="800" height="8" rx="3"/>
    <rect x="190" y="592" width="820" height="8" rx="3"/>
    <rect x="180" y="604" width="840" height="8" rx="3"/>
  </g>
  <rect x="520" y="614" width="160" height="16" rx="4" fill="#808ca0"/>
  <!-- phone -->
  <g>
    <rect x="1074" y="300" width="150" height="300" rx="20" fill="#2c3646"/>
    <rect x="1084" y="316" width="130" height="266" rx="10" fill="#f4f1ea"/>
    <g fill="#d6dbe4">
      <rect x="1094" y="330" width="110" height="38" rx="6"/>
      <rect x="1094" y="376" width="110" height="38" rx="6" fill="#9fb7dc"/>
      <rect x="1094" y="422" width="110" height="38" rx="6"/>
      <rect x="1094" y="468" width="110" height="38" rx="6"/>
    </g>
    <rect x="1084" y="546" width="130" height="36" fill="#e2e6ee"/>
  </g>
