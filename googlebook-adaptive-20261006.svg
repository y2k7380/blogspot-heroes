<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#0f141d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a52"/>
      <stop offset="1" stop-color="#1f2b3e"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa6b8"/>
      <stop offset="1" stop-color="#6f7b8e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- desk line -->
  <rect x="0" y="610" width="1280" height="110" fill="#141b26"/>
  <!-- laptop lid -->
  <rect x="190" y="70" width="820" height="500" rx="22" fill="#3a4556"/>
  <rect x="214" y="92" width="772" height="452" rx="8" fill="url(#screen)"/>
  <!-- taskbar -->
  <rect x="214" y="510" width="772" height="34" fill="#162030"/>
  <rect x="566" y="518" width="18" height="18" rx="4" fill="#5d7bb0"/>
  <rect x="592" y="518" width="18" height="18" rx="4" fill="#7fb69a"/>
  <rect x="618" y="518" width="18" height="18" rx="4" fill="#d9a35c"/>
  <!-- compact window -->
  <g>
    <rect x="236" y="116" width="150" height="372" rx="8" fill="#f4f1ea"/>
    <rect x="236" y="116" width="150" height="24" rx="8" fill="#c9d3e3"/>
    <rect x="236" y="132" width="150" height="8" fill="#c9d3e3"/>
    <circle cx="372" cy="128" r="4" fill="#8a96a8"/>
    <g fill="#d6dbe4">
      <rect x="250" y="154" width="122" height="44" rx="6"/>
      <rect x="250" y="208" width="122" height="44" rx="6"/>
      <rect x="250" y="262" width="122" height="44" rx="6"/>
      <rect x="250" y="316" width="122" height="44" rx="6"/>
      <rect x="250" y="370" width="122" height="44" rx="6"/>
    </g>
    <rect x="236" y="450" width="150" height="38" fill="#e2e6ee"/>
    <g fill="#8a96a8"><circle cx="266" cy="469" r="6"/><circle cx="311" cy="469" r="6"/><circle cx="356" cy="469" r="6"/></g>
  </g>
  <!-- medium window -->
  <g>
    <rect x="404" y="136" width="230" height="352" rx="8" fill="#f4f1ea"/>
    <rect x="404" y="136" width="230" height="24" rx="8" fill="#c9d3e3"/>
    <rect x="404" y="152" width="230" height="8" fill="#c9d3e3"/>
    <circle cx="620" cy="148" r="4" fill="#8a96a8"/>
    <rect x="404" y="160" width="40" height="328" fill="#e2e6ee"/>
    <g fill="#8a96a8"><circle cx="424" cy="190" r="6"/><circle cx="424" cy="225" r="6"/><circle cx="424" cy="260" r="6"/></g>
    <g fill="#d6dbe4">
      <rect x="456" y="174" width="164" height="54" rx="6"/>
      <rect x="456" y="238" width="164" height="54" rx="6"/>
      <rect x="456" y="302" width="164" height="54" rx="6"/>
      <rect x="456" y="366" width="164" height="54" rx="6"/>
    </g>
  </g>
  <!-- expanded window: list-detail -->
  <g>
    <rect x="652" y="116" width="312" height="372" rx="8" fill="#f4f1ea"/>
    <rect x="652" y="116" width="312" height="24" rx="8" fill="#c9d3e3"/>
    <rect x="652" y="132" width="312" height="8" fill="#c9d3e3"/>
    <rect x="828" y="122" width="96" height="12" rx="6" fill="#eef1f6"/>
    <circle cx="950" cy="128" r="4" fill="#8a96a8"/>
    <rect x="652" y="140" width="38" height="348" fill="#e2e6ee"/>
    <g fill="#8a96a8"><circle cx="671" cy="170" r="6"/><circle cx="671" cy="205" r="6"/><circle cx="671" cy="240" r="6"/></g>
    <g fill="#d6dbe4">
