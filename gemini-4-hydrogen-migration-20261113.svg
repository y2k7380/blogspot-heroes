<rect x="700" y="96" width="532" height="250" rx="16" fill="#151d29" stroke="#3a4a66" stroke-width="2"/>
<text xml:space="preserve" x="722" y="132" font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" font-size="18" fill="#ffc98a" font-weight="bold">remove before switching</text>
<text xml:space="preserve" x="722" y="172" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#c9d1d9" font-weight="normal">- cached_content  (no explicit caching)</text>
<text xml:space="preserve" x="722" y="206" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#c9d1d9" font-weight="normal">- temperature / top_p / top_k  (ignored)</text>
<text xml:space="preserve" x="722" y="240" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#c9d1d9" font-weight="normal">- max_output_tokens: 8192  (raise to 65536)</text>
<text xml:space="preserve" x="722" y="274" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#c9d1d9" font-weight="normal">- thinking_level: minimal  (error)</text>
<text xml:space="preserve" x="722" y="308" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#c9d1d9" font-weight="normal">- raw-text JSON tool calls  (MALFORMED)</text>
<rect x="48" y="400" width="1184" height="280" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<text xml:space="preserve" x="72" y="446" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#8b949e" font-weight="normal">$ pip install google-genai==3.2.0</text>
<text xml:space="preserve" x="72" y="484" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#ffc98a" font-weight="normal">UserWarning: xhigh is not a valid ThinkingLevel</text>
<text xml:space="preserve" x="72" y="522" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#c9d1d9" font-weight="normal"> -> {'thinking_config': {'thinking_level': 'xhigh'}}   # passes through as-is</text>
<text xml:space="preserve" x="72" y="560" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#8b949e" font-weight="normal">$ pip install -U google-genai   # 3.3.0, 2026-11-13</text>
<text xml:space="preserve" x="72" y="598" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#7ee787" font-weight="normal"> -> {'thinking_config': {'thinking_level': 'XHIGH'}}   # enum added</text>
<text xml:space="preserve" x="72" y="636" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#79c0ff" font-weight="normal"> -> {'temperature': 0.2, ...}   # SDK still sends it; server ignores per docs</text>
